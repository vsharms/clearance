# Round robins requests across every app replica Docker's DNS knows about
upstream clearance {
    server app:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://clearance;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503;  # skip a replica that's down
    }
}
